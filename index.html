<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IELTS Reading Workspace</title>
<style>
:root {
  --bg:#f5f7fb; --panel:#fff; --text:#172033; --muted:#667085; --line:#d9e0ec;
  --primary:#3b4cca; --soft:#eef1ff; --danger:#d92d20; --ok:#16803c; --hl:#fff49b;
  --font:18px;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text); }
.app { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.top { background:var(--panel); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.brand { font-weight:800; font-size:20px; margin-right:10px; }
button, select, input { font:inherit; }
button { border:0; border-radius:12px; padding:9px 13px; cursor:pointer; background:var(--primary); color:white; font-weight:700; }
button.secondary { background:var(--soft); color:var(--primary); }
button.ghost { background:#fff; color:var(--text); border:1px solid var(--line); }
button.danger { background:#fee4e2; color:var(--danger); }
select, input[type="text"], input[type="search"] { min-height:40px; border:1px solid var(--line); border-radius:12px; padding:8px 10px; background:white; }
#testTitle { min-width:260px; max-width:460px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
.fontbox, .searchbox { display:flex; gap:6px; align-items:center; background:white; border:1px solid var(--line); border-radius:12px; padding:4px 7px; }
.searchbox input { border:0; min-width:230px; outline:none; }
.tabs { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); overflow:auto; }
.tab { background:white; color:var(--text); border:1px solid var(--line); white-space:nowrap; }
.tab.active { background:var(--primary); color:white; }
.workspace { flex:1; min-height:0; display:grid; grid-template-columns:minmax(330px,55%) 8px minmax(330px,45%); padding:12px; }
.pane { min-width:0; min-height:0; background:var(--panel); border:1px solid var(--line); overflow:hidden; display:flex; flex-direction:column; }
.left { border-radius:16px 0 0 16px; }
.right { border-radius:0 16px 16px 0; }
.gutter { cursor:col-resize; background:linear-gradient(90deg, transparent, var(--line), transparent); }
.paneHead { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:center; background:#fbfcff; }
.paneHead b { font-size:18px; }
.content { flex:1; min-height:0; overflow:auto; padding:22px 28px; font-size:var(--font); line-height:1.75; }
h1 { margin:0 0 5px; font-size:calc(var(--font) + 8px); }
.subtitle { color:var(--muted); font-style:italic; margin-bottom:18px; }
.para { position:relative; margin:0 0 22px; padding-left:44px; }
.label { position:absolute; left:0; top:3px; width:28px; height:28px; border-radius:999px; display:grid; place-items:center; background:var(--soft); color:var(--primary); font-weight:800; font-size:14px; }
.drop { border:1.5px dashed var(--line); border-radius:12px; padding:7px 10px; margin-bottom:8px; background:#fafbff; color:var(--muted); display:flex; gap:8px; align-items:center; }
.drop.filled { color:var(--text); border-color:var(--primary); background:var(--soft); }
.drop.over { outline:3px solid rgba(59,76,202,.18); }
mark.hl { background:var(--hl); border-radius:3px; cursor:pointer; }
.searchHit { background:#ffd966; border-radius:3px; }
.searchHit.current { outline:2px solid var(--primary); }
.group { border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; background:#fcfdff; }
.group h2 { margin:0 0 8px; font-size:calc(var(--font) + 4px); }
.inst { color:var(--muted); font-weight:650; margin-bottom:14px; }
.options { display:flex; flex-direction:column; gap:8px; margin:10px 0 14px; }
.opt { border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:white; cursor:grab; font-weight:650; }
.qrow { display:grid; grid-template-columns:48px 1fr; gap:10px; border-top:1px solid var(--line); padding:13px 0; }
.qrow:first-of-type { border-top:0; }
.qnum { color:var(--primary); font-weight:900; }
.qprompt { font-weight:800; }
.choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.pill { border:1px solid var(--line); background:white; border-radius:999px; padding:7px 11px; cursor:pointer; }
.gap { width:min(380px,100%); margin-top:8px; }
.correct { border-left:5px solid var(--ok); padding-left:8px; }
.wrong { border-left:5px solid var(--danger); padding-left:8px; }
.answer { margin-top:6px; color:var(--muted); font-size:14px; font-weight:500; }
.status { color:var(--muted); font-weight:700; }
.score { position:fixed; right:16px; bottom:16px; background:white; border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 10px 40px rgba(0,0,0,.15); display:none; }
.score.show { display:block; }
@media(max-width:850px){
  .workspace { grid-template-columns:1fr; grid-template-rows:45vh 8px 1fr; }
  .left { border-radius:16px 16px 0 0; }
  .right { border-radius:0 0 16px 16px; }
  .gutter { cursor:row-resize; }
  .searchbox input { min-width:120px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">IELTS Reading Workspace</div>
    <span id="testTitle">Loading word.json...</span>
    <button class="secondary" id="syncBtn">Sync word.json</button>
    <button class="ghost" id="loadBtn">Upload JSON</button>
    <input id="fileInput" type="file" accept=".json" style="display:none">
    <div class="fontbox">
      <span>Size</span>
      <button class="ghost" id="minus">A-</button>
      <input id="fontRange" type="range" min="15" max="26" value="18">
      <button class="ghost" id="plus">A+</button>
      <b id="fontVal">18px</b>
    </div>
    <div class="searchbox">
      <input id="search" type="search" placeholder="Tìm trong bài..." />
      <span id="searchCount" class="status">0/0</span>
      <button class="ghost" id="prev">‹</button>
      <button class="ghost" id="next">›</button>
    </div>
    <button class="ghost" id="exportJson">Export JSON</button>
    <button id="checkBtn">Chấm bài</button>
    <button class="danger" id="resetBtn">Reset đáp án</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <main class="workspace" id="workspace">
    <section class="pane left">
      <div class="paneHead"><b>Reading Passage</b><div><button class="secondary" id="hlBtn">Highlight</button> <button class="ghost" id="clearHl">Xóa highlight</button></div></div>
      <div class="content" id="reading"></div>
    </section>
    <div class="gutter" id="gutter"></div>
    <section class="pane right">
      <div class="paneHead"><b>Questions</b><span class="status" id="progress">0/40 answered</span></div>
      <div class="content" id="questions"></div>
    </section>
  </main>
</div>
<div class="score" id="score"></div>
<script>
const EMBEDDED = {"id": "ielts-reading-mungo-video-games-blind-change-full", "title": "IELTS Reading Practice - Mungo Lady, Video Games, Blind to Change", "duration": 60, "sourceFile": "ielts_reading_from_images_v3(2).docx", "sourceNotes": "Converted from the uploaded Word file. This version uses the complete Passage 3 text and the full endings list for Questions 36-40 from the uploaded document.", "passages": [{"id": "p1", "label": "Passage 1", "title": "Mungo Lady and Mungo Man", "subtitle": "Controversies in Australian Prehistory", "paragraphs": [{"label": "1", "text": "Fifty thousand years ago, a lush landscape greeted the first Australians moving towards the south-east of the continent. Temperatures were cooler than now. Megafauna - giant prehistoric animals such as marsupial lions and the rhinoceros-sized diprotodon - were abundant. Freshwater lakes in areas of western New South Wales (NSW) were brimming with fish. But change was coming. By 40,000 years ago, water levels had started to drop."}, {"label": "2", "text": "A study of the sediments and graves of Lake Mungo, a dry lake bed in western NSW, has uncovered the muddy layers deposited as the lake began to dry up. Forty thousand years ago, families took refuge at the lake from the encroaching desert, leaving artefacts such as stone tools, which researchers used to determine that the first wanderers came to the area between 46,000 and 50,000 years ago. By 20,000 years ago, the lake had become the dry, dusty hole it is today. This area was first examined by the University of Melbourne geologist Professor Jim Bowler in 1969. He was searching for ancient lakes and came across the remains of a woman who had been buried with some ceremony; she was given the name ‘Mungo Lady’. In 1974, he found a second set of remains, Mungo Man, buried 300 metres away. Bowler's comprehensive study of different sediment layers has concluded that both graves are 40,000 years old."}, {"label": "3", "text": "This is much younger than the 62,000 years Mungo Man was attributed with in 1999 by a team led by Professor Alan Thorne, of the Australian National University. Thorne is the country's leading opponent of the ‘Out of Africa’ theory - that modern humans spread around the globe from Africa about 100,000 years ago. The revision of Mungo Man's age has refocused attention on academic disputes about mankind's origins."}, {"label": "4", "text": "The arrival date of these early Australians is linked to another vexed question: the reason for the disappearance of the megafauna. Dr Tim Flannery, a proponent of the controversial theory that these animals were wiped out by the extreme hunting practices of humans, claims that the new Mungo dates support this view. For Bowler, however, these debates are speculative distractions. At 40,000 years old, he argues, Mungo Man and Mungo Lady remain Australia's oldest human burials and the earliest evidence on Earth of cultural sophistication. ‘At Lake Mungo, we have a cameo of people reacting to environmental change. It is one of the great stories of the people of the world.’"}, {"label": "5", "text": "Two rival groups of researchers have each attacked the techniques used by the other to ascertain the date of Mungo Man. In the 1999 study, Thorne's team used three techniques to date Mungo Man - bone, tooth enamel and sand. Bowler has strongly challenged the results ever since. Dating human bones is ‘notoriously unreliable,’ he says. In addition, the sand sample used by Thorne's group was taken hundreds of metres from the burial site."}, {"label": "6", "text": "Bowler has stated that it is not difficult ‘to realise that the age of sand is not the same as the age of the grave’. He says his team's results are based on careful fieldwork, crosschecked between four laboratories, while Thorne's team misinterpreted the evidence, ‘locked in a laboratory in Canberra’. Thorne counters that Bowler's team used one dating technique, while his used three. Best practice is to have at least two methods producing the same result. A Thorne team member, Professor Rainer Grün, says the fact that the latest results were consistent between laboratories doesn't mean they are correct. ‘We now have two data sets that are contradictory. I do not have a plausible explanation.’"}, {"label": "7", "text": "Thorne recently made headlines with a study of Mungo Man's DNA, which he claimed supported his idea that modern humans developed from archaic humans in several places around the world, rather than emerging from Africa a relatively short time ago. Now, however, Thorne says the age of Mungo Man is irrelevant. Recent fossil finds show that modern humans were in China 110,000 years ago. ‘So he has a long time to arrive in Australia. It doesn't matter if he is 40,000 or 60,000 years old.’"}, {"label": "8", "text": "In 2001, a member of Bowler's team, Dr Richard Roberts of Wollongong University, along with Flannery, Director of the South Australian Museum, published research on the extinction of the megafauna. They dated 28 sites across the continent, arguing that their analysis showed that the megafauna died out suddenly 46,600 years ago. This conclusion has been challenged by other scientists, including Dr Judith Field of the University of Sydney and Dr Richard Fullager of the Australian Museum, who point to the presence of megafauna fossils at the 36,000-year-old Cuddie Springs site in NSW."}, {"label": "9", "text": "Flannery praises the Bowler team's research as thorough and rigorous. He says the finding that humans arrived at Lake Mungo between 46,000 and 50,000 years ago supports the idea that that was a critical time in Australia's history. There is no evidence of a dramatic climate change at that time, he says. ‘It's my view that humans arrived and megafauna extinction took place in almost the same geological instant.’ Bowler, however, is sceptical of Flannery's theory about the disappearance of the giant animals. He argues that climate change 40,000 years ago was more intense than has been previously realised and could have played an important role in their extinction."}], "questionGroups": [{"type": "matchOptions", "title": "Questions 1-8", "instruction": "Match each theory with the correct researcher(s), A-F. NB You may use any letter more than once.", "options": [{"id": "A", "text": "Jim Bowler"}, {"id": "B", "text": "Alan Thorne"}, {"id": "C", "text": "Tim Flannery"}, {"id": "D", "text": "Rainer Grün"}, {"id": "E", "text": "Richard Roberts and Tim Flannery"}, {"id": "F", "text": "Judith Field and Richard Fullager"}], "questions": [{"id": "1", "prompt": "Our human ancestors did not originate in only one area.", "answer": "B"}, {"id": "2", "prompt": "The extinction of the megafauna happened within a brief period.", "answer": "E"}, {"id": "3", "prompt": "The megafauna died out as a result of human activity.", "answer": "C"}, {"id": "4", "prompt": "The similarity of results does not always guarantee their validity.", "answer": "D"}, {"id": "5", "prompt": "How old Mungo Man is, is unimportant.", "answer": "B"}, {"id": "6", "prompt": "There is evidence to disprove the theory of mass megafauna extinction.", "answer": "F"}, {"id": "7", "prompt": "An extreme environmental change occurred at the time that humans first moved into the Lake Mungo area.", "answer": "A"}, {"id": "8", "prompt": "The earliest evidence of advanced human culture is found in Australia.", "answer": "A"}]}, {"type": "tfng", "title": "Questions 9-13", "instruction": "TRUE if the statement agrees with the information; FALSE if the statement contradicts the information; NOT GIVEN if there is no information on this.", "questions": [{"id": "9", "prompt": "Objects found in the Lake Mungo area were used to date the arrival of humans.", "answer": "TRUE"}, {"id": "10", "prompt": "Ancient weapons were found in the Lake Mungo area.", "answer": "FALSE"}, {"id": "11", "prompt": "Scientists agree about the age of Mungo Man.", "answer": "FALSE"}, {"id": "12", "prompt": "Thorne's research involved analysing more than one material.", "answer": "TRUE"}, {"id": "13", "prompt": "Bowler has criticised the research methods used by Thorne.", "answer": "TRUE"}]}]}, {"id": "p2", "label": "Passage 2", "title": "The attraction of video games", "subtitle": "The world's love of video games has much to do with people's desires and motives", "paragraphs": [{"label": "A", "text": "Video games, it is often claimed, are about wasting time. It is a misunderstanding that players and game makers have been trying to correct for many years. While movies and television are endlessly analysed in the media, games are often dismissed as irresponsible, unimportant by-products of the broader digital revolution. But a growing number of experts disagree. This is, after all, an entertainment medium that worldwide makes $50b a year. Using ideas from psychology and sociology, theorists and designers suggest that our love of video games may actually have important things to tell us about our most basic desires and motivations. Game design has become big business and has led to the creation of a multitude of companies. The industry attitude toward training has changed radically, says prominent game researcher Jesper Juul. ‘I recall hearing professionals claim that game design was a strange and unteachable art, but now this attitude has mostly faded.’ Designing video games is increasingly recognised as a valid field of university study throughout the world."}, {"label": "B", "text": "Central to an understanding of games is the theory that games are fun because they teach us in a way that our brains prefer, that is, through systems and puzzles. Raph Koster, designer of multiplayer fantasy games, points out that an effective learning environment is one in which failure is acceptable, even welcomed. Accordingly, Koster says that in games, the player enters into a situation where the rules of the real world don't apply - and typically being judged on success and failure is part of the real world. When gaming, people feel free to try things and to learn, and not worry about what might happen. Consistently, Koster says, the best games are the ones that provide us with interesting tools such as weapons or magic, and allow us to experiment with them. For example, in one early game, players are given the ability to jump, and can practise this for as long as they like, but to get to the next stage they need to master this ability so they can leap over an enemy and onto a platform. ‘Games allow us to create these little systems where learning is controlled really brilliantly,’ says Margaret Robertson, director at a London-based game design company. ‘Something we don't talk about is that, actually, one of the strengths of games is the vague sense of disapproval that still surrounds them - they feel like something that's forbidden!’ And that can, of course, be very exciting."}, {"label": "C", "text": "Another important element in the popularity of games is the player's ability to determine what happens. Games tap into our need to have direction; this is very obvious in games where we shape the lives of virtual humans, but it's becoming a vital element of action adventures too. ‘Games are increasingly complex systems,’ says Dan Pinchbeck, an experimental game designer. ‘There's an emphasis on the pleasure of choosing and planning. We've moved quite dramatically away from the very first video games. These games mostly involved the player merely reacting to events. But games then became more about approaching a situation and making a plan depending on your preferred play style.’"}, {"label": "D", "text": "Many studios design their games around reward systems. ‘A good game will have progression at the end of each level, but it will also provide surprise rewards halfway through,’ says Ben Weedon, a games studio consultant. In a game, you're essentially pressing the same buttons and doing the same things over and over again, so you need those occasional surprises to stay motivated."}, {"label": "E", "text": "Games have constantly evolved over the years and continue to do so right up to the present. Now, incorporating a narrative structure into a game is becoming increasingly important. Many games have adopted Hollywood's three-act structure, which is designed to maintain our loyalty to a particular game. As in many films, a short final act is often used to give a sense of acceleration towards a preferably startling climax. Opening levels of games are also short, because this flatters us into thinking we're making good progress, whereas the middle levels are more extensive."}, {"label": "F", "text": "Games even tap into our friendships. The rise of multiplayer gaming means that gaming increasingly involves social interaction. And other businesses are taking notice and using this as an element in advertising their brands. Then there's the new concept of ‘gamification’, in which websites and smartphone apps are being designed like games, with high scores and achievement points to keep customers entertained. Research estimates that businesses spent more than $100m worldwide on gamification projects last year, a figure predicted to rise to $1.6b in the next four years."}, {"label": "G", "text": "So, in fact, games aren't just an insignificant fad, as some people might suggest. They fulfil intrinsic human needs, whether we are conscious of it or not. The loop of learning control and rewards is at the heart of something very important, and very attractive."}], "questionGroups": [{"type": "matchingHeadings", "title": "Questions 14-19", "instruction": "Choose the correct heading for each section from the list of headings below. Drag the heading to the top of the correct paragraph, or use the dropdown.", "options": [{"id": "i", "text": "Being able to experiment without consequences"}, {"id": "ii", "text": "Why stories are included in games"}, {"id": "iii", "text": "The key role of the unexpected for game players"}, {"id": "iv", "text": "Transferring features of games to other types of products"}, {"id": "v", "text": "The age group that games most appeal to"}, {"id": "vi", "text": "The development of the video game design industry"}, {"id": "vii", "text": "Players' ability to control what occurs in games"}], "questions": [{"id": "14", "paragraph": "A", "answer": "vi"}, {"id": "15", "paragraph": "B", "answer": "i"}, {"id": "16", "paragraph": "C", "answer": "vii"}, {"id": "17", "paragraph": "D", "answer": "iii"}, {"id": "18", "paragraph": "E", "answer": "ii"}, {"id": "19", "paragraph": "F", "answer": "iv"}]}, {"type": "matchOptions", "title": "Questions 20-23", "instruction": "Match each statement with the correct expert, A-E. NB You may use any letter more than once.", "options": [{"id": "A", "text": "Jesper Juul"}, {"id": "B", "text": "Raph Koster"}, {"id": "C", "text": "Margaret Robertson"}, {"id": "D", "text": "Dan Pinchbeck"}, {"id": "E", "text": "Ben Weedon"}], "questions": [{"id": "20", "prompt": "Players' involvement in games often includes thinking ahead.", "answer": "D"}, {"id": "21", "prompt": "The inclusion of unanticipated elements keeps players interested.", "answer": "E"}, {"id": "22", "prompt": "It's now accepted that creating video games is a skill that can be learned.", "answer": "A"}, {"id": "23", "prompt": "Early games were much simpler than more recent ones.", "answer": "D"}]}, {"type": "gapfill", "title": "Questions 24-26", "instruction": "Complete the sentences below. Choose ONE WORD ONLY from the passage for each answer.", "questions": [{"id": "24", "prompt": "Koster believes that games remove people's fear of _____.", "answer": "failure"}, {"id": "25", "prompt": "Robertson's view is that games feel exciting partly because of the _____ that is associated with them.", "answer": "disapproval"}, {"id": "26", "prompt": "Narrative games are often structured so that the first and last part are both _____.", "answer": "short"}]}]}, {"id": "p3", "label": "Passage 3", "title": "Blind to Change", "subtitle": "How much of the world around you do you really see?", "paragraphs": [{"label": "1", "text": "Picture the following and prepare to be amazed. You're walking across a college campus when a stranger asks you for directions. While you're talking to him, two men pass between you carrying a wooden door. You feel a moment's irritation, but you carry on describing the route. When you've finished, you're told you've just taken part in a psychology experiment. ‘Did you notice anything after the two men passed with the door?’ the stranger asks. ‘No,’ you reply uneasily. He explains that the man who initially approached you walked off behind the door leaving him in his place. The first man now rejoins you. Comparing them, you notice that they are of different height and build and are dressed very differently."}, {"label": "2", "text": "Daniel Simons of Harvard University found that 50% of participants missed the substitution because of what is called ‘change blindness’. When considered with a large number of recent experimental results, this phenomenon suggests we ‘see’ far less than we think we do. Rather than logging every detail of the visual scene, says Simons, we are actually highly selective. Our impression of seeing everything is just that. In fact, we extract a few details and rely on memory, or even our imagination, for the rest."}, {"label": "3", "text": "Until recently, scientists believed that vision involved creating images within the brain. By forming detailed internal representations of our surroundings and comparing them over time, we could detect any alterations. However, in his book Consciousness Explained, philosopher Daniel Dennett argued that our brains only store a few key details about the world, which is why we can function effectively. According to Dennett, creating elaborate images in short-term memory would consume valuable cognitive resources. Instead, we record what has changed and assume everything else remains unchanged. As a result, we inevitably overlook some details. Experiments had demonstrated that we tend to ignore elements in our visual field that seem unimportant, such as a repeated word or line in a text. But even Dennett didn't fully realise just how little we actually ‘see.’"}, {"label": "4", "text": "A year later, John Grimes from the University of Illinois drew attention by showing that people who were presented with computer-generated images of natural scenes failed to notice changes made while their eyes were, for example, scanning the scene or blinking. Dennett was pleased: ‘In hindsight, I wish I had been bolder, as the effects are more pronounced than I originally claimed.’ Subsequently, it was discovered that our eyes don't even need to be moving to be deceived. A typical laboratory experiment might display an image on a computer screen, like a couple dining on a terrace. The image would briefly disappear, replaced by a blank screen, then reappear with a significant change, such as a raised railing behind the couple. Many people search the screen for up to a minute before spotting the alteration, and some never see it."}, {"label": "5", "text": "This is disconcerting. However, 'change blindness' is somewhat artificial because, in real-life scenarios, a visible motion usually signals a change. Yet, not always. As Simons points out, \"We all know the experience of missing a traffic signal change because we briefly looked away. 'Inattentional blindness' refers to not noticing a feature of a scene when you aren't paying attention to it.\""}, {"label": "6", "text": "Last year, Simons showed people a video of a basketball game and asked them to count the passes made by one of the teams. After 45 seconds, a man in a gorilla suit slowly walked behind the players. Forty percent didn't notice him. When the tape was replayed, and they were simply told to watch it, they easily saw the gorilla. Some even doubted it was the same video."}, {"label": "7", "text": "Now, consider if the viewers had been driving a car, and the man in the gorilla suit had been a pedestrian. Some estimates suggest that nearly half of all fatal motor vehicle accidents in the US result from driver error, including attention lapses. It's more than just academic interest that has spurred research into these cognitive errors."}, {"label": "8", "text": "These errors prompt critical questions: how can we reconcile such significant lapses with our subjective experience of continuously perceiving a rich visual environment? Last year, Stephen Kosslyn from Harvard University demonstrated that imagining a scene activates parts of the visual cortex similarly to actually seeing it. He argues that this supports the idea that we only absorb the information we consider important and mentally fill in the gaps where details are less crucial. \"The illusion that we see 'everything' is partly due to filling in gaps with memory,\" he says. \"These memories can be shaped by beliefs and expectations.\""}, {"label": "9", "text": "Ronald Rensink from the University of British Columbia in Canada believes our perception of a detailed visual world comes from constructing internal representations. He suggests that the brain first creates a temporary layout of the visual scene, and then our attention enhances the resolution of the scene. \"What attention does,\" he explains, \"is stabilize these representations so they form distinct objects. Once attention shifts, they revert to an unstable, unresolved state.\""}, {"label": "10", "text": "While Rensink or Kosslyn propose that internal images or memory play some role, others argue that we can perceive visual richness without storing any of that richness in our brains. Kevin O'Regan, an experimental psychologist, contends that our brains do not store a visual image of the world. Instead, we rely on the external visual environment as different parts of a scene become relevant."}, {"label": "11", "text": "According to O'Regan, our sense of controlling what we see is also an illusion. \"We believe that when something flickers outside the window, we choose to look,\" says Susan Blackmore from the University of the West of England, who supports O'Regan's view. \"In reality,\" she explains, \"our change detection mechanisms automatically drag our attention to various stimuli.\""}], "questionGroups": [{"type": "matchOptions", "title": "Questions 27-30", "instruction": "Match each person with the correct claim, A-G.", "options": [{"id": "A", "text": "People overlook changes that happen during eye movements."}, {"id": "B", "text": "At times, we fail to notice something because we choose to deceive ourselves."}, {"id": "C", "text": "Retaining every image and memory would hinder our ability to function effectively."}, {"id": "D", "text": "Sometimes, people overlook the significance of a crucial figure in a scene."}, {"id": "E", "text": "We misunderstand what we see because we rely on our imagination."}, {"id": "F", "text": "We don't have complete control over what captures our attention."}, {"id": "G", "text": "Imagining a scene and physically being there impact our visual processes in similar ways."}], "questions": [{"id": "27", "prompt": "Daniel Dennett", "answer": "C"}, {"id": "28", "prompt": "John Grimes", "answer": "A"}, {"id": "29", "prompt": "Stephen Kosslyn", "answer": "G"}, {"id": "30", "prompt": "Kevin O'Regan", "answer": "F"}]}, {"type": "tfng", "title": "Questions 31-35", "instruction": "TRUE if the statement agrees with the information; FALSE if the statement contradicts the information; NOT GIVEN if there is no information on this.", "questions": [{"id": "31", "prompt": "One expert expressed regret for having underemphasized his argument in a publication.", "answer": "TRUE"}, {"id": "32", "prompt": "We overlook insignificant items that come into our view.", "answer": "TRUE"}, {"id": "33", "prompt": "Research into cognitive errors might potentially save lives.", "answer": "TRUE"}, {"id": "34", "prompt": "The aging process increases the need to fill in gaps in our visual perception.", "answer": "NOT GIVEN"}, {"id": "35", "prompt": "Our eyes are only at risk of being deceived when they are in motion.", "answer": "FALSE"}]}, {"type": "matchOptions", "title": "Questions 36-40", "instruction": "Complete each sentence with the correct ending, A-G.", "options": [{"id": "A", "text": "is not backed by scientific evidence."}, {"id": "B", "text": "is provided by memory."}, {"id": "C", "text": "causes us to overlook other details."}, {"id": "D", "text": "has been especially fruitful in recent times."}, {"id": "E", "text": "has sparked significant public debate."}, {"id": "F", "text": "is challenging for us to accept."}, {"id": "G", "text": "helps us see the overall picture more clearly."}], "questions": [{"id": "36", "prompt": "Concentrating on a particular aspect of an activity or scene", "answer": "C"}, {"id": "37", "prompt": "The fact that we make visual errors", "answer": "F"}, {"id": "38", "prompt": "The part of the picture that we fail to see clearly", "answer": "B"}, {"id": "39", "prompt": "The idea that we see everything in our visual field", "answer": "A"}, {"id": "40", "prompt": "Research into the nature of human vision", "answer": "E"}]}]}]};
const KEY='ielts_reading_answers_clean_v1';
let test = null, current = 0, answers = JSON.parse(localStorage.getItem(KEY)||'{}'), checked=false;
let searchHits=[], searchIndex=-1;
const $=id=>document.getElementById(id);
function toast(msg){ const s=$('score'); s.innerHTML='<b>'+msg+'</b>'; s.classList.add('show'); setTimeout(()=>s.classList.remove('show'),2200); }
function cacheUrl(u){ return u + (u.includes('?')?'&':'?') + 'v=' + Date.now(); }
async function syncWord(){
  try {
    const res = await fetch(cacheUrl('./word.json'), {cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    loadTest(data, true);
    toast('Đã load word.json mới nhất');
  } catch(e) {
    loadTest(EMBEDDED, true);
    toast('Không fetch được word.json, đang dùng bản nhúng trong index');
  }
}
function loadTest(data, replace=false){
  test = Array.isArray(data.tests) ? data.tests[0] : data;
  if(replace) { checked=false; current=0; }
  $('testTitle').textContent = test.title || 'IELTS Reading';
  render();
}
function allQuestions(){
  return test.passages.flatMap(p=>p.questionGroups.flatMap(g=>g.questions));
}
function key(qid){ return test.id+'_'+qid; }
function setAnswer(qid,val){ answers[key(qid)] = val; localStorage.setItem(KEY,JSON.stringify(answers)); updateProgress(); }
function getAnswer(qid){ return answers[key(qid)] || ''; }
function norm(s){ return String(s||'').trim().toLowerCase(); }
function isCorrect(q){ return norm(getAnswer(q.id)) === norm(q.answer); }
function render(){
  renderTabs(); renderReading(); renderQuestions(); updateProgress(); setFont($('fontRange').value);
}
function renderTabs(){
  $('tabs').innerHTML = test.passages.map((p,i)=>`<button class="tab ${i===current?'active':''}" onclick="current=${i};checked=false;render()">${p.label||('Passage '+(i+1))}</button>`).join('');
}
function renderReading(){
  const p=test.passages[current];
  let html=`<h1>${esc(p.title)}</h1><div class="subtitle">${esc(p.subtitle||'')}</div>`;
  const headingGroup = p.questionGroups.find(g=>g.type==='matching-headings');
  p.paragraphs.forEach((para,idx)=>{
    let drop='';
    if(headingGroup){
      const q=headingGroup.questions.find(x=>x.targetParagraph===para.label || x.prompt===('Section '+para.label));
      if(q) {
        const ans=getAnswer(q.id);
        const opt=headingGroup.options.find(o=>o.id===ans);
        drop=`<div class="drop ${ans?'filled':''}" data-q="${q.id}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropHeading(event,this)"><b>${q.prompt}:</b> ${opt?esc(opt.id+'. '+opt.text):'Kéo heading vào đây'}</div>`;
      }
    }
    html+=`<div class="para">${drop}<span class="label">${esc(para.label||idx+1)}</span>${esc(para.text)}</div>`;
  });
  $('reading').innerHTML = html;
  restoreHighlights();
}
function renderQuestions(){
  const p=test.passages[current];
  let html='';
  p.questionGroups.forEach(g=>{
    html+=`<div class="group"><h2>${esc(g.title)}</h2><div class="inst">${esc(g.instruction||'')}</div>`;
    if(g.optionsTitle) html+=`<b>${esc(g.optionsTitle)}</b>`;
    if(g.options && Array.isArray(g.options) && typeof g.options[0]==='object') {
      html+='<div class="options">'+g.options.map(o=>`<div class="opt" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${escAttr(o.id)}')"><b>${esc(o.id)}.</b> ${esc(o.text)}</div>`).join('')+'</div>';
    }
    g.questions.forEach(q=>{
      const cls = checked ? (isCorrect(q)?'correct':'wrong') : '';
      html+=`<div class="qrow ${cls}"><div class="qnum">${q.id}</div><div class="qprompt">${esc(q.prompt)}`;
      if(g.type==='tfng') {
        html+=`<div class="choices">${['TRUE','FALSE','NOT GIVEN'].map(v=>`<label class="pill"><input type="radio" name="q${q.id}" ${getAnswer(q.id)===v?'checked':''} onchange="setAnswer('${q.id}','${v}')"> ${v}</label>`).join('')}</div>`;
      } else if(g.type==='gap-fill') {
        html+=` <input class="gap" value="${escAttr(getAnswer(q.id))}" oninput="setAnswer('${q.id}',this.value)" placeholder="Type answer"> ${esc(q.suffix||'')}`;
      } else {
        const opts=(g.options||[]).map(o=>typeof o==='object'?o.id:o);
        html+=` <select onchange="setAnswer('${q.id}',this.value)"><option value="">-- chọn --</option>${opts.map(o=>`<option value="${escAttr(o)}" ${getAnswer(q.id)===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
      }
      if(checked) html+=`<div class="answer">Đáp án: <b>${esc(q.answer)}</b> | Bạn chọn: <b>${esc(getAnswer(q.id)||'')}</b></div>`;
      html+='</div></div>';
    });
    html+='</div>';
  });
  $('questions').innerHTML = html;
}
function dropHeading(ev,el){ ev.preventDefault(); el.classList.remove('over'); const id=ev.dataTransfer.getData('text/plain'); setAnswer(el.dataset.q,id); renderReading(); renderQuestions(); }
function updateProgress(){
  if(!test) return;
  const qs=allQuestions(); const done=qs.filter(q=>getAnswer(q.id)).length;
  $('progress').textContent=`${done}/${qs.length} answered`;
}
function check(){
  checked=true; renderQuestions();
  const qs=allQuestions(); const score=qs.filter(isCorrect).length;
  $('score').innerHTML=`<b>Score: ${score}/${qs.length}</b><br><span class="status">Sai: ${qs.length-score}</span>`;
  $('score').classList.add('show');
}
function resetAnswers(){
  if(!confirm('Xóa toàn bộ đáp án bài này?')) return;
  allQuestions().forEach(q=>delete answers[key(q.id)]);
  localStorage.setItem(KEY,JSON.stringify(answers)); checked=false; renderQuestions(); updateProgress();
}
function setFont(v){ document.documentElement.style.setProperty('--font',v+'px'); $('fontVal').textContent=v+'px'; localStorage.setItem('ielts_font_clean',v); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return esc(s).replace(/\n/g,' '); }
function highlight(){
  const sel=window.getSelection(); if(!sel.rangeCount||sel.isCollapsed) return;
  const r=sel.getRangeAt(0); if(!$('reading').contains(r.commonAncestorContainer)) return;
  const mark=document.createElement('mark'); mark.className='hl'; r.surroundContents(mark); sel.removeAllRanges();
}
function restoreHighlights(){ /* highlights are visible only for current session in this clean version */ }
$('reading').onclick=e=>{ if(e.target.matches('mark.hl')) e.target.replaceWith(document.createTextNode(e.target.textContent)); };
function clearHl(){ document.querySelectorAll('#reading mark.hl').forEach(m=>m.replaceWith(document.createTextNode(m.textContent))); }
function clearSearchMarks(){
  document.querySelectorAll('mark.searchHit').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  searchHits=[]; searchIndex=-1; $('searchCount').textContent='0/0';
}
function doSearch(){
  clearSearchMarks();
  const q=$('search').value.trim(); if(!q) return;
  ['reading','questions'].forEach(id=>markSearch($(id),q));
  searchHits=[...document.querySelectorAll('mark.searchHit')];
  if(searchHits.length) { searchIndex=0; focusHit(); }
  $('searchCount').textContent=searchHits.length?`1/${searchHits.length}`:'0/0';
}
function markSearch(root,term){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.nodeValue.toLowerCase().includes(term.toLowerCase())?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const text=node.nodeValue, re=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    const frag=document.createDocumentFragment(); let last=0, m;
    while((m=re.exec(text))){ frag.append(document.createTextNode(text.slice(last,m.index))); const mark=document.createElement('mark'); mark.className='searchHit'; mark.textContent=m[0]; frag.append(mark); last=m.index+m[0].length; }
    frag.append(document.createTextNode(text.slice(last))); node.parentNode.replaceChild(frag,node);
  });
}
function focusHit(){
  searchHits.forEach(x=>x.classList.remove('current'));
  const h=searchHits[searchIndex]; if(!h) return; h.classList.add('current'); h.scrollIntoView({block:'center',behavior:'smooth'});
  $('searchCount').textContent=`${searchIndex+1}/${searchHits.length}`;
}
function moveHit(d){ if(!searchHits.length)return; searchIndex=(searchIndex+d+searchHits.length)%searchHits.length; focusHit(); }
function exportJson(){
  const blob=new Blob([JSON.stringify(test,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='word.json'; a.click(); URL.revokeObjectURL(a.href);
}
$('syncBtn').onclick=syncWord; $('loadBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>loadTest(JSON.parse(r.result),true); r.readAsText(f); };
$('checkBtn').onclick=check; $('resetBtn').onclick=resetAnswers;
$('minus').onclick=()=>{$('fontRange').value=Math.max(15,Number($('fontRange').value)-1);setFont($('fontRange').value);};
$('plus').onclick=()=>{$('fontRange').value=Math.min(26,Number($('fontRange').value)+1);setFont($('fontRange').value);};
$('fontRange').oninput=e=>setFont(e.target.value); $('hlBtn').onclick=highlight; $('clearHl').onclick=clearHl;
$('search').oninput=doSearch; $('prev').onclick=()=>moveHit(-1); $('next').onclick=()=>moveHit(1); $('exportJson').onclick=exportJson;
const savedFont=localStorage.getItem('ielts_font_clean')||18; $('fontRange').value=savedFont; setFont(savedFont);
syncWord();
// split resize
let drag=false; $('gutter').onmousedown=()=>drag=true; window.onmouseup=()=>drag=false; window.onmousemove=e=>{ if(!drag || innerWidth<850)return; const r=$('workspace').getBoundingClientRect(); let pct=((e.clientX-r.left)/r.width)*100; pct=Math.max(30,Math.min(70,pct)); $('workspace').style.gridTemplateColumns=`minmax(330px,${pct}%) 8px minmax(330px,${100-pct}%)`; };
</script>
</body>
